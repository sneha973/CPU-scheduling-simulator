<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPU Scheduling Simulator</title><link rel="stylesheet" href="/static/app.css"></head>
<body><header><div><span class="eyebrow">OPERATING SYSTEMS LAB</span><h1>CPU Scheduling Simulator</h1><p>Run one workload through four policies. Compare the timelines and trade-offs.</p></div><button id="sample" class="secondary">Load sample</button></header>
<main><form hidden>{% csrf_token %}</form><section class="panel"><div class="section-title"><div><h2>Workload</h2><p>Lower priority number means higher priority.</p></div><label>RR quantum <input id="quantum" type="number" min="1" value="2"></label></div><div class="table-wrap"><table><thead><tr><th>Process ID</th><th>Arrival</th><th>Burst</th><th>Priority</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button id="add" class="secondary">+ Add process</button><button id="run">Run all algorithms</button></div><div id="message" role="status"></div></section>
<section id="recommendation" class="recommendation hidden"></section><section id="results" class="results"></section><section class="panel"><div class="section-title"><div><h2>Recent runs</h2><p>Saved locally in SQLite on this machine.</p></div><button id="refresh" class="secondary">Refresh</button></div><div id="history"></div></section></main><script src="/static/app.js"></script></body></html>
