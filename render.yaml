services:
  - type: web
    name: cpu-scheduling-simulator
    runtime: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: python manage.py migrate && gunicorn scheduler_site.wsgi:application --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
